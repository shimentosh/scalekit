<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, 'SF Pro Text', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.9"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1020"/><stop offset="1" stop-color="#16122b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- Left: blurry -->
  <g transform="translate(40 40)">
    <rect width="540" height="340" rx="16" fill="#1a1a24" stroke="#ef4444" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="20" y="20" width="118" height="30" rx="15" fill="#ef4444" fill-opacity="0.18"/>
    <text x="79" y="40" fill="#fca5a5" font-size="14" font-weight="700" text-anchor="middle">✕ Blurry</text>
    <text x="20" y="84" fill="#e5e7eb" font-size="17" font-weight="600">macOS “Larger Text” on a 3440 × 1440 panel</text>
    <text x="20" y="108" fill="#9ca3af" font-size="13">Rendered at 1× below the panel resolution, then stretched up</text>
    <g filter="url(#blur)">
      <text x="20" y="168" fill="#f3f4f6" font-size="34" font-weight="700">Quarterly report</text>
      <text x="20" y="208" fill="#d1d5db" font-size="19">Revenue grew 18% while costs stayed flat.</text>
      <text x="20" y="238" fill="#d1d5db" font-size="19">func scale(_ factor: Double) -&gt; Size</text>
      <rect x="20" y="266" width="230" height="10" rx="5" fill="#6b7280"/>
      <rect x="20" y="286" width="170" height="10" rx="5" fill="#6b7280"/>
    </g>
  </g>

  <!-- Right: sharp -->
  <g transform="translate(620 40)">
    <rect width="540" height="340" rx="16" fill="#1a1a24" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="20" y="20" width="118" height="30" rx="15" fill="#22c55e" fill-opacity="0.18"/>
    <text x="79" y="40" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">✓ Sharp</text>
    <text x="20" y="84" fill="#e5e7eb" font-size="17" font-weight="600">ScaleKit 125% on the same panel</text>
    <text x="20" y="108" fill="#9ca3af" font-size="13">Rendered at 2× (5504 × 2304), then scaled down to native</text>
    <text x="20" y="168" fill="#ffffff" font-size="34" font-weight="700">Quarterly report</text>
    <text x="20" y="208" fill="#e5e7eb" font-size="19">Revenue grew 18% while costs stayed flat.</text>
    <text x="20" y="238" fill="#e5e7eb" font-size="19">func scale(_ factor: Double) -&gt; Size</text>
    <rect x="20" y="266" width="230" height="10" rx="5" fill="#a78bfa"/>
    <rect x="20" y="286" width="170" height="10" rx="5" fill="#38bdf8"/>
  </g>
  <text x="600" y="406" fill="#6b7280" font-size="12" text-anchor="middle">Illustration of the effect. Take a close-up photo of your own monitor to compare.</text>
</svg>
